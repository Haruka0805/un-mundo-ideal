<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>投稿 - 編み物作品ギャラリー</title>
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="./config.js"></script>
    <script src="./firebase-init.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="topbar">
        <div class="brand">
          <strong>編み物作品ギャラリー</strong>
          <span>投稿</span>
        </div>
        <div class="nav">
          <a class="btn" href="./index.html">一覧へ</a>
        </div>
      </div>

      <div id="status" class="status">準備中…</div>

      <div id="authSection" style="display: none">
        <div class="hint" id="authHint" style="margin: 0 0 14px"></div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap">
          <button id="signOutBtn" class="btn" type="button">ログアウト</button>
        </div>
      </div>

      <form id="form" class="panel" style="display: none">
        <div class="form">
          <div class="row">
            <label for="title">作品名（必須）</label>
            <input id="title" name="title" type="text" placeholder="例：春のモチーフマフラー" maxlength="80" required />
          </div>

          <div class="row">
            <label for="description">説明（任意）</label>
            <textarea id="description" name="description" placeholder="例：コットン糸で編みました。サイズ：◯◯" maxlength="800"></textarea>
          </div>

          <div class="row">
            <label for="files">写真（複数可）</label>
            <input id="files" name="files" type="file" accept="image/*" multiple required />
            <div class="hint">最初の写真が表紙になります。</div>
          </div>

          <div class="row">
            <div class="hint" id="limitHint"></div>
            <div id="previews" class="previews"></div>
          </div>

          <button id="submitBtn" class="btn" type="submit">投稿する</button>
        </div>
      </form>

      <div id="signInSection" style="display: block">
        <div class="hint" style="margin-bottom: 14px">
          投稿するには Google でログインしてください（閲覧は誰でもできます）。
        </div>
        <button id="signInBtn" class="btn" type="button">Googleでログインして投稿</button>
      </div>
    </div>

    <script src="./upload.js"></script>
  </body>
</html>
