<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - 多言語対応</title>
    <style>
        body {
            background-color: #f1f2f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
            line-height: 1.8;
            padding: 20px;
            padding-bottom: 100px;
            margin: 0;
        }

        /* 言語切り替えボタンのスタイル */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
        }

        .lang-btn {
            background: #fff;
            border: 2px solid #89bdd3;
            color: #89bdd3;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: #89bdd3;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 50px auto 0; /* ボタン用の余白 */
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .line-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
        }

        .line-item.highlight {
            background-color: rgba(137, 189, 211, 0.18);
            border-left: 5px solid #89bdd3;
        }

        .play-btn {
            background: #89bdd3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
        }

        .play-btn::before { content: "▶"; }

        ruby rt {
            font-size: 0.6em;
            color: #666;
        }

        .audio-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .glossary-container {
            margin-top: 20px;
        }

        .glossary-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .glossary-item {
            background: rgba(200, 216, 225, 0.8);
            border: 1px solid rgba(137, 189, 211, 0.35);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .profile-card {
            background: rgba(198, 211, 208, 0.8);
            border: 1px solid rgba(137, 189, 211, 0.5);
            border-radius: 15px;
            padding: 18px;
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #89bdd3;
        }

        .profile-info {
            width: 100%;
        }

        .profile-item {
            margin-bottom: 10px;
        }

        .profile-label {
            font-weight: bold;
            color: #89bdd3;
        }

        .profile-text {
            margin-left: 8px;
            color: #4a4051;
        }

        .glossary-term {
            font-weight: bold;
            color: #89bdd3;
        }

        .glossary-meaning,
        .glossary-example {
            display: block;
            margin-top: 6px;
            color: #4d586a;
            line-height: 1.5;
        }

        .keyword {
            border-bottom: 1px dashed #89bdd3;
            color: #89bdd3;
            cursor: help;
            position: relative;
        }

        .keyword::after {
            content: attr(data-meaning);
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(100% + 10px);
            white-space: nowrap;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 100;
        }

        .keyword:hover::after {
            opacity: 1;
            visibility: visible;
        }

        audio { height: 40px; width: 240px; }

        /* レスポンシブデザイン */
        @media (max-width: 768px) {
            /* スマートフォン */
            .container {
                width: 100%;
                max-width: none;
                margin: 20px 10px 0;
                padding: 15px;
            }
            body {
                padding: 10px;
                padding-bottom: 80px;
            }
            .lang-switch {
                top: 10px;
                right: 10px;
            }
            .audio-container {
                bottom: 10px;
                right: 10px;
                padding: 8px;
            }
            audio {
                width: 200px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            /* タブレット */
            .container {
                max-width: 800px;
                padding: 20px;
            }
        }

        @media (min-width: 1025px) {
            /* PC */
            .container {
                max-width: 1200px;
                padding: 30px;
            }
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="lang-btn active" id="btn-ja" onclick="toggleLanguage('ja')">JP</button>
    <button class="lang-btn" id="btn-en" onclick="toggleLanguage('en')">EN</button>
</div>

<div class="container">
    <h2 id="title">自己紹介</h2>
    <div id="profile-container"></div>
    <div id="lyrics-container"></div>
    <div id="glossary-container" class="glossary-container"></div>
</div>

<div class="audio-container">
    <audio id="myAudio" controls src="71hello.wav"></audio>
</div>

<script>
    // 1. 言語データの定義
    const langData = {
        ja: {
            title: '<ruby>自己紹介<rt>じこしょうかい</rt></ruby>',
            audio: '71hello.wav',
            profile: [
                { label: '名前', text: '青木 遥' },
                { label: '留学先', text: 'サイモンフレーザー大学（バンクーバー）' },
                { label: '選択した第二言語', text: 'スペイン語' },
                { label: '趣味', text: '編み物、ドライブ' },
                { label: '目標', text: '英語を楽しく学べるアプリを作ること' }
            ],
            lines: [
                { start: 0, text: 'こんにちは。<ruby>私<rt>わたし</rt></ruby>の<ruby>名前<rt>なまえ</rt></ruby>は<ruby>青木<rt>あおき</rt></ruby> <ruby>遥<rt>はるか</rt></ruby>です。' },
                { start: 4, text: '<ruby>第二言語<rt>だいにげんご</rt></ruby>はスペイン<ruby>語<rt>ご</rt></ruby>を<ruby>選択<rt>せんたく</rt></ruby>していました。<ruby>留学<rt>りゅうがく</rt></ruby>はカナダのバンクーバーにあるサイモンフレーザー<ruby>大学<rt>だいがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。' },
                { start: 12, text: 'これまでのゼミの<ruby>活動<rt>かつどう</rt></ruby>では、<ruby>映画<rt>えいが</rt></ruby>『アラジン』の「A Whole New World」を<ruby>題材<rt>だいざい</rt></ruby>にして、<ruby>英語<rt>えいご</rt></ruby>を<ruby>楽<rt>たの</rt></ruby>しく<ruby>学<rt>まな</rt></ruby>べるアプリを<ruby>作成<rt>さいせい</rt></ruby>しました。<ruby>宜<rt>よろ</rt></ruby>しくお<ruby>願<rt>ねが</rt></ruby>いします。' }
            ]
        },
        en: {
            title: 'Self Introduction',
            audio: '71hello_en.wav', // 英語音声ファイル名をここに設定
            profile: [
                { label: 'Name', text: 'Haruka Aoki' },
                { label: 'Study abroad', text: 'Simon Fraser University (Vancouver)' },
                { label: 'Chosen second language', text: 'Spanish' },
                { label: 'Hobby', text: 'Knitting and driving' },
                { label: 'Goal', text: 'Create an app that makes learning English fun' }
            ],
            lines: [
                { start: 0, text: 'Hello. My name is Haruka Aoki.' },
                { start: 4, text: 'I <span class="keyword" data-meaning="選んだ">chose</span> Spanish as my <span class="keyword" data-meaning="第二言語">second language</span>. For my <span class="keyword" data-meaning="留学">study abroad</span> program, I went to Simon Fraser University in Vancouver, Canada.' },
                { start: 12, text: 'In my <span class="keyword" data-meaning="ゼミ">seminar</span>, I <span class="keyword" data-meaning="開発した">developed</span> an English learning <span class="keyword" data-meaning="アプリ">app</span> using the song "A Whole New World" from the movie Aladdin to make learning more fun.\nThank you.' }
            ],
            glossary: [
                { term: 'chose', meaning: '選んだ', example: 'I chose Spanish. = 私はスペイン語を選びました。' },
                { term: 'second language', meaning: '第二言語', example: 'A language you learn after your native language.' },
                { term: 'study abroad', meaning: '留学', example: 'I went to study abroad in Canada.' },
                { term: 'seminar', meaning: 'ゼミ', example: 'In my seminar, I developed an English learning app.' },
                { term: 'developed', meaning: '開発した', example: 'I developed an app to make learning more fun.' },
                { term: 'app', meaning: 'アプリ', example: 'An app is a software program for learning or playing.' },
                { term: 'through', meaning: '〜を通して', example: 'Learn English through songs and stories.' }
            ]
        }
    };

    let currentLang = 'ja';
    const audio = document.getElementById('myAudio');
    const container = document.getElementById('lyrics-container');
    const profileContainer = document.getElementById('profile-container');
    const glossaryContainer = document.getElementById('glossary-container');
    const title = document.getElementById('title');

    // 2. 表示の更新関数
    function updateDisplay() {
        const data = langData[currentLang];
        title.innerHTML = data.title;
        audio.src = data.audio;
        
        container.innerHTML = data.lines.map(line => `
            <div class="line-item" data-start="${line.start}">
                <button class="play-btn" onclick="seekAudio(${line.start})"></button>
                <span>${line.text}</span>
            </div>
        `).join('');

        if (data.profile) {
            profileContainer.innerHTML = `<div class="profile-card">
                <img src="myphoto.jpg" alt="Profile Photo" class="profile-photo">
                <div class="profile-info">
                    ${data.profile.map(item => `
                        <div class="profile-item">
                            <span class="profile-label">${item.label}:</span>
                            <span class="profile-text">${item.text}</span>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        } else {
            profileContainer.innerHTML = '';
        }

        if (currentLang === 'en' && data.glossary) {
            glossaryContainer.innerHTML = `<div class="glossary-title">Key words and phrases</div>` + data.glossary.map(item => `
                <div class="glossary-item">
                    <span class="glossary-term">${item.term}</span>
                    <span class="glossary-meaning">${item.meaning}</span>
                    <span class="glossary-example">${item.example}</span>
                </div>
            `).join('');
        } else {
            glossaryContainer.innerHTML = '';
        }
    }

    // 3. 言語切り替え
    function toggleLanguage(lang) {
        currentLang = lang;
        
        // ボタンの見た目更新
        document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        
        updateDisplay();
    }

    function seekAudio(seconds) {
        audio.currentTime = seconds;
        audio.play();
    }

    // 4. ハイライト処理
    audio.addEventListener('timeupdate', () => {
        let currentTime = audio.currentTime;
        let activeIndex = -1;
        const lines = document.querySelectorAll('.line-item');

        lines.forEach((line, index) => {
            const startTime = parseFloat(line.getAttribute('data-start'));
            if (currentTime >= startTime) {
                activeIndex = index;
            }
        });

        lines.forEach((line, index) => {
            if (index === activeIndex) {
                line.classList.add('highlight');
            } else {
                line.classList.remove('highlight');
            }
        });
    });

    // 初期表示
    updateDisplay();
</script>

</body>
</html>
