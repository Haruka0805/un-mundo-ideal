<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編み物ログ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>編み物ログ</h1>
    <div class="actions">
      <button id="openDialogBtn" class="btn primary">＋ 記録を追加</button>
      <button id="printBtn" class="btn">🖨 印刷</button>
      <button id="clearAllBtn" class="btn danger">全削除</button>
    </div>
  </header>

  <main>
    <section class="log-section">
      <h2>前回までの記録</h2>
      <div id="emptyState" class="empty">まだ記録がありません。「＋ 記録を追加」からどうぞ。</div>
      <div class="table-wrap">
        <table id="logTable" class="log-table" aria-describedby="tableCaption">
          <caption id="tableCaption" class="sr-only">編み物の記録一覧</caption>
          <thead>
            <tr>
              <th>日付</th>
              <th>作品名</th>
              <th>毛糸の種類</th>
              <th>ツール</th>
              <th>号数/サイズ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 追加モーダル -->
  <dialog id="entryDialog">
    <form id="entryForm" method="dialog">
      <h3>記録の追加</h3>

      <label class="field">
        <span>作品名 <span class="req">*</span></span>
        <input type="text" name="entryName" id="entryName" required placeholder="例）斜めボーダーのネクタイ" />
      </label>

      <label class="field">
        <span>毛糸の種類 <span class="req">*</span></span>
        <input type="text" name="yarnType" id="yarnType" required placeholder="例）中細コットン" />
      </label>

      <fieldset class="field">
        <legend>ツール <span class="req">*</span></legend>
        <label class="radio">
          <input type="radio" name="toolType" value="かぎ針" required /> かぎ針
        </label>
        <label class="radio">
          <input type="radio" name="toolType" value="棒針" /> 棒針
        </label>
      </fieldset>

      <label class="field">
        <span>号数/サイズ <span class="req">*</span></span>
        <input type="text" name="toolSize" id="toolSize" required placeholder="例）6/0号, US 8 など" />
      </label>

      <menu class="dialog-actions">
        <button type="reset" id="cancelBtn" class="btn">キャンセル</button>
        <button type="submit" class="btn primary">保存</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
