<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>友達の部屋 - Virtual Study Trip</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      background-color: #fffaf0;
      padding: 1.5rem;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #444;
    }

    .prompt-box {
      background-color: #fff;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 10px;
      margin: 1rem 0;
      white-space: pre-wrap;
    }

    .button {
      display: block;
      text-align: center;
      background-color: #4caf50;
      color: white;
      padding: 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 1rem;
    }

    .button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>🏠 友達の部屋に遊びに行く</h1>
  <p><strong>今日のトピック：</strong><br>「ルームメイトのLisaと、最近あったことについて話す」</p>

  <p>👇 以下のプロンプトをコピーして、<strong>ChatGPT</strong>で貼り付けて会話してみてね：</p>

  <div class="prompt-box">
あなたはルームメイトのLisaです。
私は日本からの留学生で、あなたの部屋に遊びにきたところです。
あいさつのあと、最近どうしていたかを聞いてください。
会話は3〜5ターン程度で自然に進めてください。
英語で会話してください。
  </div>

  <a class="button" href="https://chat.openai.com/" target="_blank">
    ▶️ ChatGPTで会話を始める
  </a>
</body>
</html>
