<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Listening Test</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(to bottom, #4e0082, #6f3f8b, #db7093);
  background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 0;
        color: #333;
    }

    #container {
        width: 100%;
        max-width: 600px;
        background: #ffffff75;
        padding: 20px;
        box-sizing: border-box;
        text-align: center;
        height: 100vh; /* スマホ向けに画面いっぱいに */
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* ボタン共通スタイル */
    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 15px 0;
        margin: 10px 0;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background-color 0.2s;
        touch-action: manipulation;
    }

    button:active {
        background-color: #0056b3;
    }

    button:disabled {
        background-color: #ccc;
        cursor: default;
    }

    /* 音声再生ボタン */
    #replay-btn {
        background-color: #28a745;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
    }

    #replay-btn svg {
        margin-right: 8px;
        fill: white;
        width: 24px;
        height: 24px;
    }

    /* 選択肢ボタン */
    .option-btn {
        background-color: #fff;
        color: #333;
        border: 2px solid #e0e0e0;
        font-size: 20px; /* 文字を大きく */
        padding: 20px 0;
    }

    .option-btn:active {
        background-color: #f0f0f0;
    }

    /* フィードバック画面 */
    #feedback-screen h1 {
        font-size: 3rem;
        margin: 0 0 10px 0;
        color: #007bff;
    }

    #feedback-screen p {
        font-size: 1.5rem;
        margin: 0;
        color: #555;
    }

    /* 結果画面 */
    #result-screen h2 {
        font-size: 2.5rem;
        margin-bottom: 10px;
    }

    #result-screen p {
        font-size: 5rem;
        font-weight: bold;
        color: #007bff;
        margin: 0;
    }

    /* 画面切り替え用 */
    .screen {
        display: none;
        width: 100%;
    }
    .active {
        display: block;
    }

    /* 正誤判定の色 */
    .correct-style {
        background-color: #d4edda !important;
        border-color: #c3e6cb !important;
        color: #155724 !important;
    }
    .wrong-style {
        background-color: #f8d7da !important;
        border-color: #f5c6cb !important;
        color: #721c24 !important;
    }

</style>
</head>
<body>

<div id="container">
    <div id="start-screen" class="screen active">
        <button id="start-btn" style="height: 100px; font-size: 24px;">試験開始</button>
    </div>

    <div id="quiz-screen" class="screen">
        <button id="replay-btn">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            音声を聞く
        </button>
        <div id="options-container">
            </div>
    </div>

    <div id="feedback-screen" class="screen">
        <h1 id="fb-word">Word</h1>
        <p id="fb-meaning">意味</p>
        <div id="fb-status" style="margin-top:20px; font-size: 1.2rem;"></div>
    </div>

    <div id="result-screen" class="screen">
        <p id="score-display">0</p>
        <h2 style="font-size:1.2rem; color:#666;">点</h2>
    </div>
</div>

<script>
    // --- データセット（アップロードされたファイルから抽出した単語） ---
    const questionsData = [
        { word: "Fancy", correct: "高級な・装飾的な", distractors: ["質素な・謙虚な", "鈍い・薄暗い"] },
        { word: "Wood rot", correct: "木材の腐敗", distractors: ["家宝", "夢心地・恍惚"] },
        { word: "Caravan", correct: "隊商（キャラバン）", distractors: ["反乱", "尖塔（ミナレット）"] },
        { word: "Roam", correct: "歩き回る・放浪する", distractors: ["蓄積する・集める", "値切る"] },
        { word: "Fabled", correct: "伝説の", distractors: ["高級な・装飾的な", "性急な・慌てた"] },
        { word: "Haggle", correct: "値切る", distractors: ["空気を読む・察する", "過小評価する"] },
        { word: "Trance", correct: "夢心地・恍惚", distractors: ["感情・情緒", "木材の腐敗"] },
        { word: "Diamond in the rough", correct: "原石・磨けば光る人", distractors: ["悪党・ろくでなし", "下層民・クズ"] },
        { word: "Heirloom", correct: "家宝", distractors: ["ペンネーム・偽名", "尖塔（ミナレット）"] },
        { word: "Street rat", correct: "ドブネズミ（浮浪児）", distractors: ["大臣", "破壊者"] },
        { word: "Riffraff", correct: "下層民・クズ", distractors: ["原石・磨けば光る人", "侍女"] },
        { word: "Scoundrel", correct: "悪党・ろくでなし", distractors: ["ドブネズミ（浮浪児）", "破壊者"] },
        { word: "Take a hint", correct: "空気を読む・察する", distractors: ["歩き回る・放浪する", "蓄積する・集める"] },
        { word: "Nom de plume", correct: "ペンネーム・偽名", distractors: ["家宝", "伝説の"] },
        { word: "Vandal", correct: "破壊者", distractors: ["大臣", "悪党・ろくでなし"] },
        { word: "Hasty", correct: "性急な・慌てた", distractors: ["鈍い・薄暗い", "質素な・謙虚な"] },
        { word: "Vizier", correct: "大臣", distractors: ["侍女", "隊商（キャラバン）"] },
        { word: "Amass", correct: "蓄積する・集める", distractors: ["過小評価する", "歩き回る・放浪する"] },
        { word: "Sentiment", correct: "感情・情緒", distractors: ["反乱", "夢心地・恍惚"] },
        { word: "Underestimate", correct: "過小評価する", distractors: ["値切る", "空気を読む・察する"] },
        { word: "Humble", correct: "質素な・謙虚な", distractors: ["高級な・装飾的な", "伝説の"] },
        { word: "Handmaid", correct: "侍女", distractors: ["大臣", "下層民・クズ"] },
        { word: "Revolt", correct: "反乱", distractors: ["感情・情緒", "隊商（キャラバン）"] },
        { word: "Minaret", correct: "尖塔（ミナレット）", distractors: ["ペンネーム・偽名", "家宝"] },
        { word: "Dim", correct: "鈍い・薄暗い", distractors: ["性急な・慌てた", "高級な・装飾的な"] }
    ];

    // --- 変数 ---
    let currentQuestionIndex = 0;
    let score = 0;
    let quizQuestions = [];
    let synth = window.speechSynthesis;
    let selectedVoice = null;
    let voices = [];

    // --- DOM要素 ---
    const startScreen = document.getElementById('start-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const feedbackScreen = document.getElementById('feedback-screen');
    const resultScreen = document.getElementById('result-screen');
    const startBtn = document.getElementById('start-btn');
    const replayBtn = document.getElementById('replay-btn');
    const optionsContainer = document.getElementById('options-container');
    const fbWord = document.getElementById('fb-word');
    const fbMeaning = document.getElementById('fb-meaning');
    const fbStatus = document.getElementById('fb-status');
    const scoreDisplay = document.getElementById('score-display');

    // --- 音声設定 ---
    function loadVoices() {
        voices = synth.getVoices() || [];

        // ブラウザ判定
        const ua = navigator.userAgent || '';
        const isChrome = /Chrome/.test(ua) && !/Edg|Edge|OPR/.test(ua);
        const isBrave = !!(navigator.brave);
        const isSafari = /^((?!chrome|android).)*safari/i.test(ua);

        // 優先順位:
        // 1) Chrome/Brave: 名前に "Google" を含む高品質音声
        // 2) macOS/iOS の代表的な音声 (Samantha, Alex, Daniel)
        // 3) lang === 'en-US'
        // 4) lang が英語系のもの (startsWith 'en')
        // 5) 最後に最初の音声を利用

        let voice = null;
        if ((isChrome || isBrave) && voices.length) {
            voice = voices.find(v => /google/i.test(v.name));
        }
        if (!voice && voices.length) {
            voice = voices.find(v => ['Samantha','Alex','Daniel','Moira','Karen'].includes(v.name));
        }
        if (!voice && voices.length) {
            voice = voices.find(v => v.lang === 'en-US');
        }
        if (!voice && voices.length) {
            voice = voices.find(v => v.lang && v.lang.startsWith('en'));
        }
        selectedVoice = voice || (voices.length ? voices[0] : null);
        // デバッグログ（開発時のみ）
        try { console.debug('TTS voices loaded:', voices.map(v=>v.name)); console.debug('Selected voice:', selectedVoice && selectedVoice.name); } catch(e){}
    }

    // 音声リストは非同期でロードされるブラウザがあるため、変化時に再取得
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    // 最初に一度取得を試みる
    loadVoices();

    function speakWord(text) {
        if (synth.speaking) {
            try { synth.cancel(); } catch(e){}
        }

        // voices がまだ空の場合は再試行する（onvoiceschanged が呼ばれるまで待つ）
        if (!voices || voices.length === 0) {
            loadVoices();
            // 少し待ってから再トライ
            setTimeout(() => speakWord(text), 250);
            return;
        }

        const utterThis = new SpeechSynthesisUtterance(text);
        if (selectedVoice) {
            utterThis.voice = selectedVoice;
            utterThis.lang = selectedVoice.lang || 'en-US';
        } else {
            utterThis.lang = 'en-US';
        }

        // ブラウザでの速度補正（Safari は rate の解釈が異なることがあるため標準）
        const ua2 = navigator.userAgent || '';
        const isSafari2 = /^((?!chrome|android).)*safari/i.test(ua2);
        utterThis.rate = isSafari2 ? 1.0 : 0.95;
        utterThis.pitch = 1.0;

        try { synth.speak(utterThis); } catch(e) { console.error('TTS speak error:', e); }
    }

    // --- ゲームロジック ---

    // 配列をシャッフルする関数
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function showScreen(screen) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        screen.classList.add('active');
    }

    function startTest() {
        // iOS対策：ユーザーアクションで一度空の音声を再生してエンジンを初期化
        speakWord(''); 
        
        // ランダムで最大5問を選択（問題数が5未満の場合は全問）
        const numQuestions = Math.min(5, questionsData.length);
        quizQuestions = shuffleArray([...questionsData]).slice(0, numQuestions);

        currentQuestionIndex = 0;
        score = 0;
        showScreen(quizScreen);
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizQuestions[currentQuestionIndex];
        
        // 選択肢作成
        optionsContainer.innerHTML = '';
        const allOptions = [q.correct, ...q.distractors];
        shuffleArray(allOptions);

        allOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.className = 'option-btn';
            btn.onclick = () => checkAnswer(opt, q.correct);
            optionsContainer.appendChild(btn);
        });

        // 少し待ってから再生（画面遷移と被らないように）
        setTimeout(() => {
            speakWord(q.word);
        }, 500);
    }

    function checkAnswer(selected, correct) {
        const isCorrect = selected === correct;
        if (isCorrect) score++;

        // フィードバック表示
        const q = quizQuestions[currentQuestionIndex];
        fbWord.textContent = q.word;
        fbMeaning.textContent = q.correct;
        
        if(isCorrect) {
            fbStatus.textContent = "○ Correct";
            fbStatus.style.color = "#28a745";
        } else {
            fbStatus.textContent = "× Wrong";
            fbStatus.style.color = "#dc3545";
        }

        showScreen(feedbackScreen);

        // 3秒後に次へ
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                showScreen(quizScreen);
                loadQuestion();
            } else {
                endTest();
            }
        }, 3000);
    }

    function endTest() {
        // 問題数に応じて100点満点換算
        const finalScore = Math.round((score / quizQuestions.length) * 100);
        scoreDisplay.textContent = finalScore;
        showScreen(resultScreen);
    }

    // --- イベントリスナー ---
    startBtn.addEventListener('click', startTest);
    replayBtn.addEventListener('click', () => {
        const q = quizQuestions[currentQuestionIndex];
        if (q) speakWord(q.word);
    });

</script>
</body>
</html>
