<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アラジンとジャスミンの冒険</title>
    <style>

        #player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 1000;
        }

        #player {
            height: 200px;
            width: 355px;
        }

        /* 歌詞部分のスタイル */
        #lyrics-content {
            padding: 0px;
            margin-top: 0px;
            font-size: 1.2em;
            line-height: 2.5; /* ルビと訳語の行間を確保 */
        }

        /* 訳語（<sub>タグ）のスタイル調整 */
        #lyrics-content sub {
            font-size: 0.7em;
            vertical-align: top; /* 標準の下付き配置を調整 */
            position: relative;
            top: 0.5em; /* ルビの下に配置されるよう調整 */
            margin-right: 1.5em; /* 単語間のスペース */
            opacity: 0.8;
            color: #444; /* 色を付けて視認性アップ */
        }

        /* ルビのフォントサイズを調整 */
        rt {
            font-size: 0.8em;
        }
        
        /* 1. 新規追加: 歌詞ハイライト時のスタイル */
        .lyrics-line.highlight {
            background-color: #ffe0b2;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        /* 2. 新規追加: シークボタンのスタイル */
        .seek-button {
            margin-right: 10px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1.2em;
        }
        
        /* 歌詞全体のコンテナ */
        #lyrics-content {
            padding: 20px;
            margin-top: 0px;
            font-size: 1.2em;
            line-height: 2.5; 
        }

        /* 個別の歌詞行 */
        .lyrics-line {
            padding: 5px;
            margin-bottom: 5px;
        }
        
        /* 訳語（<sub>タグ）のスタイル調整 */
        #lyrics-content sub {
            font-size: 0.7em;
            vertical-align: top; 
            position: relative;
            top: 0.5em; 
            margin-right: 1.5em; 
            opacity: 0.8;
            color: #444; 
        }
        
        rt {
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <h1>アラジンとジャスミンの冒険</h1>

    <div id="lyrics-content">
        <div id="line1" class="lyrics-line">
            <button class="seek-button" onclick="seekTo(4)">▶️</button>
            <ruby>Un<rt>ウン</rt></ruby><sub>(一つの)</sub> 
            <ruby>mundo<rt>ムンド</rt></ruby><sub>(世界)</sub> 
            <ruby>ideal<rt>イデアル</rt></ruby><sub>(理想的な)</sub>
        </div>
        
        <div id="line2" class="lyrics-line">
            <button class="seek-button" onclick="seekTo(19)">▶️</button>
            <ruby>Un<rt>ウン</rt></ruby><sub>(一つの)</sub> 
            <ruby>mundo<rt>ムンド</rt></ruby><sub>(世界)</sub> 
            <ruby>en<rt>エン</rt></ruby><sub>(で)</sub> 
            <ruby>que<rt>ケ</rt></ruby><sub>(〜)</sub> 
            <ruby>tu<rt>トゥ</rt></ruby><sub>(きみ)</sub> 
            <ruby>y<rt>イ</rt></ruby><sub>(と)</sub> 
            <ruby>yo<rt>ヨ</rt></ruby><sub>(ぼく)</sub>
        </div>
        
        <div id="line3" class="lyrics-line">
            <button class="seek-button" onclick="seekTo(25)">▶️</button>
            <ruby>Podamos<rt>ポダモス</rt></ruby><sub>(できる)</sub> 
            <ruby>decidir<rt>デシディル</rt></ruby><sub>(決める)</sub>
        </div>

        <div id="line4" class="lyrics-line">
            <button class="seek-button" onclick="seekTo(33)">▶️</button>
            <ruby>Donde<rt>ドンデ</rt></ruby><sub>(どこに)</sub> 
            <ruby>ir<rt>イル</rt></ruby><sub>(行く)</sub> 
            <ruby>y<rt>イ</rt></ruby><sub>(そして)</sub> 
            <ruby>como<rt>コモ</rt></ruby><sub>(どのように)</sub> 
            <ruby>no<rt>ノ</rt></ruby><sub>(〜しない)</sub>
        </div>
        
        <div id="line5" class="lyrics-line"><button class="seek-button" onclick="seekTo(46)">▶️</button>（次の歌詞行 46秒）</div>
        <div id="line6" class="lyrics-line"><button class="seek-button" onclick="seekTo(58)">▶️</button>（次の歌詞行 58秒）</div>
        <div id="line7" class="lyrics-line"><button class="seek-button" onclick="seekTo(68)">▶️</button>（次の歌詞行 68秒）</div>
        <div id="line8" class="lyrics-line"><button class="seek-button" onclick="seekTo(76)">▶️</button>（次の歌詞行 76秒）</div>
        <div id="line9" class="lyrics-line"><button class="seek-button" onclick="seekTo(87)">▶️</button>（次の歌詞行 87秒）</div>

    </div>

    <div id="player-container">
        <div id="player"></div>
    </div>

    <script>
        // ... (2. 新規追加したJavaScriptの内容をここに全て挿入) ...
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var checkInterval;

        const syncLyricsData = [
            { id: 'line1', time: 4 },
            { id: 'line2', time: 19 },
            { id: 'line3', time: 25 },
            { id: 'line4', time: 33 },
            { id: 'line5', time: 46 },
            { id: 'line6', time: 58 },
            { id: 'line7', time: 68 },
            { id: 'line8', time: 76 },
            { id: 'line9', time: 87 }
        ];

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: '_aAOTfOU4lA', 
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 1,
                    'start': 31 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) { }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                syncLyrics();
            } else {
                clearInterval(checkInterval);
            }
        }

        function syncLyrics() {
            clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                const currentTime = Math.floor(player.getCurrentTime());
                
                document.querySelectorAll('.lyrics-line').forEach(line => {
                    line.classList.remove('highlight');
                });

                for (let i = 0; i < syncLyricsData.length; i++) {
                    const currentLine = syncLyricsData[i];
                    const nextLine = syncLyricsData[i + 1];

                    // 要件4: タイムスタンプの1秒前に開始
                    const startTime = currentLine.time - 1;
                    
                    const endTime = nextLine ? nextLine.time : 99999; 

                    if (currentTime >= startTime && currentTime < endTime) {
                        document.getElementById(currentLine.id).classList.add('highlight');
                        break;
                    }
                }
            }, 100);
        }

        function seekTo(time) {
            player.seekTo(time, true);
            player.playVideo();
        }
    </script>

</body>
</html>
