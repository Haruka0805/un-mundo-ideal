<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎨 色見本メーカー（一体型）</title>
  <style>
    :root{
      --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; color:var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #f6f8ff 100%);
    }
    /* 共通ボタン */
    .btn{
      border:1px solid var(--line); background:#fff; color:var(--ink);
      padding:8px 12px; border-radius:10px; font-weight:700; cursor:pointer;
    }
    .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn:hover{ filter:brightness(0.98); }

    /* レイアウト */
    .wrap{ max-width:980px; margin:28px auto 48px; padding:0 16px; }
    header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    header h1{ margin:0; font-size:1.35rem; }

    /* カード */
    .card{
      background:var(--panel); border:1px solid var(--line); border-radius:16px;
      box-shadow:0 10px 30px rgba(15,23,42,.06);
      padding:18px 18px 12px; margin-bottom:18px; text-align:center;
    }
    .title{ margin:0 0 4px 0; font-size:1.3rem; }
    .subtitle{ margin:0 0 12px 0; color:var(--muted); }

    /* フォーム */
    .palette-form{
      display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px;
    }
    .palette-label{ font-size:1.1rem; font-weight:700; }
    .palette-input{
      width:72px; height:36px; padding:6px 8px;
      border:1px solid var(--line); border-radius:10px; font-size:1rem; text-align:center;
    }

    /* パレットのグリッド */
    .palette-grid{
      display:grid; grid-template-columns: repeat(5, minmax(0, 1fr));
      gap:12px; margin-top:14px;
    }
    @media (max-width:980px){ .palette-grid{ grid-template-columns: repeat(4, 1fr); } }
    @media (max-width:720px){ .palette-grid{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width:520px){ .palette-grid{ grid-template-columns: repeat(2, 1fr); } }

    /* スウォッチ */
    .swatch{
      border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;
      transform: translateY(4px); opacity:0; animation: popIn .22s ease forwards;
    }
    @keyframes popIn{ to{ transform: translateY(0); opacity:1; } }

    .chip{ width:100%; aspect-ratio: 4/3; display:grid; place-items:center;
           font-weight:800; font-size:1.05rem; }
    .meta{
      display:flex; justify-content:space-between; align-items:center; gap:8px;
      padding:10px 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .meta code{ font-weight:700; letter-spacing:.3px; }
    .copy-btn{
      border:1px solid var(--line); border-radius:10px; padding:6px 10px; cursor:pointer; background:#fff; font-weight:600;
    }
    .copy-btn:hover{ filter:brightness(0.98); }
    .copy-btn:active{ transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎨 色見本メーカー</h1>
    </header>

    <section class="card">
      <h2 class="title">ランダムパレットを作る</h2>
      <p class="subtitle">色の数を選んで「生成」を押すと、ランダムな色が出ます（1〜5色）。</p>

      <form id="colorForm" class="palette-form" onsubmit="return false;">
        <label for="colorCount" class="palette-label">色の数（1〜5）</label>
        <input type="number" id="colorCount" min="1" max="5" value="3" class="palette-input" />
        <button id="genBtn" type="button" class="btn primary">生成</button>
      </form>
    </section>

    <div id="palette" class="palette-grid" aria-live="polite"></div>
  </div>

  <script>
    const PALETTE_LS_KEY = "knitPalette";

    // 0x000000〜0xFFFFFF のHEXカラーをランダム生成
    function randomHex(){
      return "#" + Math.floor(Math.random() * 0xFFFFFF)
                     .toString(16).padStart(6, "0").toUpperCase();
    }

    // 背景色に対して見やすい文字色（黒/白）を選ぶ
    function textColorForBg(hex){
      const h = hex.replace("#", "");
      const r = parseInt(h.substr(0,2),16);
      const g = parseInt(h.substr(2,2),16);
      const b = parseInt(h.substr(4,2),16);
      const yiq = (r*299 + g*587 + b*114) / 1000;
      return yiq >= 140 ? "#0f172a" : "#ffffff";
    }

    function renderPalette(colors){
      const grid = document.getElementById("palette");
      if (!grid) return;
      grid.innerHTML = "";
      const frag = document.createDocumentFragment();

      colors.forEach((hex, i) => {
        const card = document.createElement("div");
        card.className = "swatch";
        card.style.animationDelay = `${i * 0.03}s`;

        const chip = document.createElement("div");
        chip.className = "chip";
        chip.style.background = hex;
        chip.style.color = textColorForBg(hex);
        chip.textContent = hex;

        const meta = document.createElement("div");
        meta.className = "meta";

        const codeEl = document.createElement("code");
        codeEl.textContent = hex;

        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.type = "button";
        btn.textContent = "コピー";
        btn.addEventListener("click", async () => {
          try{
            await navigator.clipboard.writeText(hex);
            const old = btn.textContent;
            btn.textContent = "OK!";
            setTimeout(() => btn.textContent = old, 900);
          }catch{ alert("コピーできませんでした"); }
        });

        meta.append(codeEl, btn);
        card.append(chip, meta);
        frag.appendChild(card);
      });

      grid.appendChild(frag);
      try{ localStorage.setItem(PALETTE_LS_KEY, JSON.stringify(colors)); }catch{}
    }

    function generatePalette(n){
      const count = Math.max(1, Math.min(5, Number(n) || 3));
      const colors = Array.from({length: count}, randomHex);
      renderPalette(colors);
    }

    // 初期化
    (function init(){
      const input = document.getElementById("colorCount");
      const btn = document.getElementById("genBtn");

      // 前回のパレットを復元 or 初期生成
      try{
        const saved = JSON.parse(localStorage.getItem(PALETTE_LS_KEY) || "[]");
        if (Array.isArray(saved) && saved.length){
          renderPalette(saved);
          if (input) input.value = String(Math.min(5, Math.max(1, saved.length)));
        }else{
          generatePalette(input?.value ?? 3);
        }
      }catch{
        generatePalette(input?.value ?? 3);
      }

      btn?.addEventListener("click", () => generatePalette(input?.value));
    })();
  </script>
</body>
</html>
