<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>あみもの―と</title>
  <link rel="stylesheet" href="mission6-3.css" />
</head>
<body>
  <aside class="sidebar">
    <h2>メニュー</h2>
    <nav>
      <a href="mission6-3.html">記録</a>
      <a href="mission6-3color.html">色見本メーカー</a>
      <a href="mission6-3picture.html">写真ギャラリー</a>
    </nav>
  </aside>
  <header class="site-header">
    <h1>編み物ログ</h1>
  </header>

  <main>
   <section class="card">
      <h2 class="title">ランダムパレットを作る</h2>
      <p class="subtitle">色の数を選んで「生成」を押すと、ランダムな色が出ます（1〜5色）。</p>

      <form id="colorForm" class="palette-form" onsubmit="return false;">
        <label for="colorCount" class="palette-label">色の数（1〜5）</label>
        <input type="number" id="colorCount" min="1" max="5" value="3" class="palette-input" />
        <button id="genBtn" type="button" class="btn primary">生成</button>
      </form>
    </section>
  <div id="palette" style="display:flex; gap: 10px; margin-top:10px;"></div>
</main>

<script>
function randomHex(){
  return "#" + Math.floor(Math.random() * 0xFFFFFF)
                 .toString(16)
                 .padStart(6, "0")
                 .toUpperCase();
}

document.getElementById("genBtn").addEventListener("click", () => {
  const n = Math.max(1, Math.min(5, Number(document.getElementById("colorCount").value)));
  const palette = document.getElementById("palette");
  palette.innerHTML = ""; 

  for(let i = 0; i < n; i++){
    const color = randomHex();
    const box = document.createElement("div");
    box.style.width = "100px";
    box.style.height = "100px";
    box.style.background = color;
    box.style.display = "flex";
    box.style.alignItems = "center";
    box.style.justifyContent = "center";
    box.style.color = "#fff";
    box.style.fontWeight = "bold";
    box.style.fontSize = "2rem"; // ← ここを追加
    box.textContent = color;
    palette.appendChild(box);
  }
});
</script>
</body>
</html>
