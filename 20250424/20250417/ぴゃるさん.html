プログラミングを始める<br>
＜h1＞(エイチいち)文字＜/h1＞で<h1>文字を目立たせることができる</h1><br>

・<p>＜mark＞と＜/mark＞で<mark>マーカー表示ができる</mark><br>
・＜del＞と＜/del＞で<del>打消し線ができる</del><br>
・＜small＞と＜/small＞タグは<small>文字が小さくなる</small><br>
・＜strong＞＜/strong＞タグは<strong>文字が太字になる</strong><br>
・＜p＞1は段落。見出しでも箇条書きでもない普通の文章は原則としてこれで囲む。</p><br>
