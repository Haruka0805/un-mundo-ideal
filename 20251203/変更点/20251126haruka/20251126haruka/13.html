<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アラジンとジャスミンの冒険</title>
    <style>
        /* ... (動画固定、サイズ設定のCSSは省略) ... */
        #player-container {
            position: fixed;
            bottom: 0;
            right: 0;
            z-index: 1000;
        }

        #player {
            height: 200px;
            width: 355px;
        }

        /* 歌詞部分のスタイル */
        #lyrics-content {
            padding: 0px;
            margin-top: 0px;
            font-size: 1.2em;
            line-height: 2.5; /* ルビと訳語の行間を確保 */
        }

        /* 訳語（<sub>タグ）のスタイル調整 */
        #lyrics-content sub {
            font-size: 0.7em;
            vertical-align: top; /* 標準の下付き配置を調整 */
            position: relative;
            top: 0.5em; /* ルビの下に配置されるよう調整 */
            margin-right: 1.5em; /* 単語間のスペース */
            opacity: 0.8;
            color: #444; /* 色を付けて視認性アップ */
        }

        /* ルビのフォントサイズを調整 */
        rt {
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<h1>アラジンとジャスミンの冒険</h1>
<div id="lyrics-content">

        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
