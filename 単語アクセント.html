単語は、活用形・変化形ではなく、辞書の見出し語（基本形）とする
試験問題の選択肢として表示する「意味」を<b>...</b>でくくる
34行目の_shikenName = "..."に「1文字言語名:文字:歌（タイトル）」を入れる
*/

<b>crit</b>ical：重大な、批判的な
de<b>gree</b>：程度、学位
de<b>vel</b>op：発達する、開発する
dis<b>tin</b>guish：区別する

pro<b>fi</b>cient：熟達した、堪能な
pro<b>nun</b>ciation：発音
